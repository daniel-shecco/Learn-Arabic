name: Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Copy web app into the Android project
        run: npm run build && npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lingua-path.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lingua-path-apk
          path: lingua-path.apk

      # A fixed "android-latest" release always holds the newest APK, so you can
      # download it straight from your phone: Releases → Lingua Path for Android.
      - name: Publish to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lingua Path for Android (latest build)
          prerelease: true
          make_latest: false
          files: lingua-path.apk
          body: |
            Latest Android build from `${{ github.ref_name }}` @ `${{ github.sha }}` (build ${{ github.run_number }}).

            **Install:** open this page on your Android phone, tap **lingua-path.apk**, then allow "Install unknown apps" for your browser when asked.
            New builds install over the old one and keep your progress.
