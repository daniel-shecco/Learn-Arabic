<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lingua Path — Arabic & Italian</title>
  <meta name="description" content="Interactive, speaking-first Arabic and Italian course: listening, speaking, reading and writing, with spaced repetition and handwriting practice.">
  <meta name="theme-color" content="#4c6ef5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lingua Path">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>Lingua Path needs JavaScript to run.</noscript>
  </div>
  <script>
    // If the app fails to start, show what went wrong instead of a blank screen.
    (function () {
      function fail(msg) {
        var app = document.getElementById('app');
        if (!app || app.querySelector('.topbar, .onboarding, .player')) return;
        app.innerHTML = '<div style="padding:32px 20px;font-family:sans-serif;text-align:center">'
          + '<h2>Lingua Path couldn\'t start</h2><p>Please close and reopen the app. If this keeps happening, send this message to the developer:</p>'
          + '<pre style="white-space:pre-wrap;text-align:left;background:#eee;color:#222;padding:12px;border-radius:8px;font-size:12px"></pre></div>';
        app.querySelector('pre').textContent = String(msg);
      }
      window.addEventListener('error', function (e) { fail((e.message || 'Script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { fail(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
      window.__appScriptFailed = function () { fail('A script file failed to load.'); };
    })();
  </script>
  <!-- Capacitor runtime: connects to native features inside the Android/iOS app; harmless in a browser -->
  <script src="js/vendor/capacitor.js"></script>
  <script type="module" src="js/app.js" onerror="__appScriptFailed()"></script>
</body>
</html>
